services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - '8080:8080'
    volumes:
      - ./src:/app/src # Mount the src directory for hot reloading
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./package.json:/app/package.json
      - ./vite.config.ts:/app/vite.config.ts
    environment:
      CHOKIDAR_USEPOLLING: 'true' # Fixes hot reloading issues on some systems
    stdin_open: true # For interactive processes like the dev server
    tty: true
  prod:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '80:80'
