server {
    listen       80;
    server_name  localhost; # Or your domain name

    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html; # Important for Vue Router
    }

    # Optional: Enable Gzip compression
    gzip on;
    gzip_types text/plain application/javascript application/x-javascript text/css application/json;

    # Optional: Set Cache Headers
    location ~* \.(?:css|js|json|svg|eot|ttf|woff|woff2)$ {
        expires 365d;
        add_header Cache-Control "public";
    }
}